<!doctype html>
<html amp="amp" lang="en">
  <head>
    <meta charset="utf-8">
    <title>Page Not Found - AMP Admin Panel</title>
    <link rel="canonical" href="404.html">
    <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
    <script async="async" src="https://cdn.ampproject.org/v0.js"></script>
    <style amp-boilerplate="amp-boilerplate">body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-o-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style><noscript><style amp-boilerplate="amp-boilerplate">body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>
    <style amp-custom="amp-custom">
      :root {
        --bg-main: #f1f5f9;
        --card-bg: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --primary: #4f46e5;
        --border-color: #e2e8f0;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-main); color: var(--text-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
      .card { background-color: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-width: 480px; width: 100%; padding: 40px 32px; text-align: center; }
      .icon { font-size: 64px; margin-bottom: 16px; }
      .title { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: var(--text-primary); }
      .desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.6; }
      .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; background-color: var(--primary); color: #ffffff; text-decoration: none; transition: background-color 0.2s; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🔍</div>
      <h1 class="title">404 - Page Not Found</h1>
      <p class="desc">The admin page or resource you are looking for does not exist or has been moved.</p>
      <a href="index.html" class="btn">Return to Dashboard</a>
    </div>
  </body>
</html>
